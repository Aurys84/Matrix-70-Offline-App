# Ez a fájl mondja meg a GitHubnak, hogyan építse meg az Android alkalmazásodat
name: Android Build 

# Akkor indul el automatikusan, ha frissíted a kódot (push)
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest # A GitHub szervere, ahol az építés történik
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v3
        
      - name: Java környezet beállítása
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      # Ez a parancs indítja az Android buildet (a Gradle-t)
      - name: Alkalmazás építése (Gradle)
        run: ./gradlew assembleDebug
        
      # Ez a rész teszi elérhetővé a kész .apk fájlt letöltésre
      - name: APK fájl mentése
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
